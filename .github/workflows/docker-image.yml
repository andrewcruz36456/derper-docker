name: Docker Image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * MON"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Get latest tailscale version
        run: |
          TAILSCALE_VERSION=$(curl -s https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r '.tag_name')
          if [[ ! "$TAILSCALE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected version format: $TAILSCALE_VERSION"
            exit 1
          fi
          echo "Latest tailscale version: $TAILSCALE_VERSION"
          echo "TAILSCALE_VERSION=$TAILSCALE_VERSION" >> $GITHUB_ENV

      - name: Check if image already exists
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://ghcr.io/v2/${REPO}/manifests/${TAILSCALE_VERSION}")
          IMAGE_EXISTS=$([ "$HTTP_CODE" -eq 200 ] && echo "true" || echo "false")
          echo "HTTP code: $HTTP_CODE, Image exists: $IMAGE_EXISTS"
          echo "IMAGE_EXISTS=$IMAGE_EXISTS" >> $GITHUB_ENV

      - name: Set up QEMU
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DERP_VERSION=${{ env.TAILSCALE_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/derper:${{ env.TAILSCALE_VERSION }}
            ghcr.io/${{ github.repository_owner }}/derper:latest
